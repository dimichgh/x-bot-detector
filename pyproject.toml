[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "x-bot-detector"
version = "0.1.0"
description = "Detect coordinated follow-farm / bot clusters on X (Twitter) from account metadata, creation-date clustering, follow-graph density and posting behaviour."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.26",
    "networkx>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Authenticated backend that uses your logged-in X browser session cookies.
twscrape = ["twscrape>=0.20"]
# Read X cookies straight out of a local Chrome/Firefox/Safari profile.
browser = ["browser-cookie3>=0.19"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
xbot = "xbotdetect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xbotdetect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
